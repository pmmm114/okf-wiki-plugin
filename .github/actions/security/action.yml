# 보안 계층 — 올라가면 안 되는 것이 추적되거나 새어 나갔는지.
#
# 이 repo는 public이다. push된 것은 지워도 포크·캐시·이벤트 API에 남으므로 방어선은
# "새어 나간 뒤 지우기"가 아니라 "머지되기 전에 막기"에 있다.
#
# 검사를 둘로 나눈 이유. 시크릿 **값** 탐지는 계속 갱신되는 룰셋이 곧 품질이라 전용
# 도구가 낫고, "이 repo에서 어떤 **파일**이 올라오면 안 되는지"는 이 repo만 아는
# 규칙이라 도구가 대신 알 수 없다. 그래서 값은 gitleaks에, 파일·권한 규칙은 자체
# 스크립트에 맡긴다. 자체 스크립트가 무네트워크·무의존인 덕에 lefthook pre-push에서
# **같은 코드**가 돌아 로컬에서 통과한 것이 CI에서도 통과한다.
name: 보안
description: 금지 파일·워크플로 권한 게이트(자체)와 시크릿 값 스캔(gitleaks).
runs:
  using: composite
  steps:
    - name: 보안 게이트 (금지 파일·워크플로 권한·머신 경로)
      shell: bash
      run: python3 scripts/security_scan.py

    - name: 시크릿 스캔 (gitleaks)
      # 커밋 SHA로 핀한다 — 태그는 옮겨 달 수 있어서 `@v3`은 버전이 아니라 포인터다.
      # v2가 아니라 v3인 이유는 런타임이다: v2는 Node 20이고 GitHub은 2026-09-16에
      # 러너에서 Node 20을 제거한다(그 뒤로는 어떤 옵션으로도 돌지 않는다).
      #
      # 라이선스: 개인 계정 repo는 키가 필요 없다. **org 계정으로 포크하면**
      # `GITLEAKS_LICENSE`(무료 발급)를 secret으로 넣어야 이 스텝이 선다 — 포크한
      # 쪽이 알아야 하는 조건이라 여기 적어 둔다.
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        # composite action에서는 `secrets` 컨텍스트를 못 읽는다 — `github.token`이
        # 같은 값을 주는 유일한 경로다.
        GITHUB_TOKEN: ${{ github.token }}
        # PR 코멘트는 끈다. 켜려면 `pull-requests: write`가 필요한데, 결과를 보는
        # 경로(잡 요약·SARIF 아티팩트)는 이미 있으므로 그 권한을 얻자고 워크플로
        # 토큰을 넓힐 이유가 없다.
        GITLEAKS_ENABLE_COMMENTS: "false"
