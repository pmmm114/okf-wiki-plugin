# CI — 검사 내용은 `.github/actions/<카테고리>/action.yml`에 있고 여기는 순서만 정한다.
#
# 왜 잡을 나누지 않고 composite action인가. 잡 이름 `core`는 main 브랜치 룰셋의
# required status check 컨텍스트다. 이름이 갈리거나 잡이 늘면 잡이 red가 되는 게
# 아니라 required check가 매칭되지 않아 **아무것도 막지 않게 된다**. 그런데 워크플로
# 파일을 나눠 참조하는 수단(reusable workflow)은 잡 레벨 호출이라 반드시 잡이 늘고
# 컨텍스트도 `core / <피호출자>`로 갈린다. composite action은 **스텝 레벨** 호출이라
# 잡은 `core` 하나로 남는다 — 그래서 파일 분리에 이걸 쓴다.
# (게이트: scripts/test_repo_contract.py)
name: ci
on:
  push:
  pull_request:
    # 기본 활동 타입(opened·synchronize·reopened)에는 `edited`가 없다. 그대로 두면
    # 멀쩡한 제목으로 열어 green을 받은 뒤 제목·본문만 고쳐도 정책 게이트가 다시
    # 돌지 않아, 스쿼시 때 그 제목이 그대로 main에 새겨진다.
    types: [opened, synchronize, reopened, edited]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # --- 준비 -------------------------------------------------------------
      # 로컬 composite action(`./.github/actions/…`)은 체크아웃된 뒤에야 참조된다.
      # 이 두 스텝이 아래 모든 `uses:`의 전제라 카테고리로 빼지 않는다.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # 정책 게이트가 PR 범위의 커밋 메시지를 읽는다(스쿼시가 그 본문을 main에 합침).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # --- 검사 -------------------------------------------------------------
      # 싼 것부터. 형식으로 걸릴 PR을 느린 컨포먼스까지 끌고 가지 않는다.
      - name: 정책 (PR 이벤트 전용)
        uses: ./.github/actions/policy
      - name: Epic 완결성 (통합 PR 전용)
        uses: ./.github/actions/epic-completeness
      - name: 린트·포맷
        uses: ./.github/actions/lint
      - name: 빌드
        uses: ./.github/actions/build
      - name: 테스트
        uses: ./.github/actions/test
      - name: 컨포먼스
        uses: ./.github/actions/conformance
      - name: 공급망
        uses: ./.github/actions/supply-chain
      - name: 플러그인 검증
        uses: ./.github/actions/plugin
