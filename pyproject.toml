# 루트 pyproject 셔틀 (#58) — pre-commit(language: python)과 `pip install <repo루트>`
# 소비 전용. 단일 원천은 okf-core/pyproject.toml이며, 여기서는 동일 배포를
# 루트에서 빌드할 수 있게 wheel 패키지 경로만 재지정한다.
[project]
name = "okf-core"
# 버전-중립 플레이스홀더(#164) — 단일 원천 okf-core/pyproject.toml과 동기. 릴리스 PR에서만
# 실번호로 올렸다가 릴리스 후 복귀한다(docs/releasing.md).
version = "0.0.0.dev0"
description = "OKF knowledge bundle engine (root install shim)"
requires-python = ">=3.10"
dependencies = ["pyyaml"]
license = "MIT"

# 개발 전용 도구(PEP 735) — `pip install <루트>`와 pre-commit 소비 경로에는 따라가지
# 않는다. 훅 매니저를 여기 두어 의존성 설치에 자연스럽게 따라오게 한다.
[dependency-groups]
dev = ["lefthook>=2.1"]

[project.scripts]
okf = "okf_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["okf-core/src/okf_core"]

[tool.hatch.build.targets.wheel.sources]
"okf-core/src" = ""

[tool.ruff]
line-length = 100
extend-exclude = ["okf-core/vendor"]  # 벤더 무수정 원칙 — lint/format 대상 제외
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
