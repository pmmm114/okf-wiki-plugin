# 유닛 PR이 Epic 통합 브랜치(epic/<n>)로 머지될 때 도는 후처리 — 자동화(게이트 아님).
# core 잡 밖의 별도 워크플로다: required 체크가 아니라 side-effect(sub-issue 닫기·로스터
# 코멘트·통합 PR 재실행)라서 그렇다. test_repo_contract는 ci.yml만 governs하므로 이 잡
# 이름은 core일 필요가 없다.
name: epic-subissue
on:
  pull_request:
    types: [closed]
jobs:
  on-merge-to-epic:
    # 머지됐고 base가 epic/* 일 때만. 닫히기만 한 PR·비-epic base는 건너뛴다.
    if: github.event.pull_request.merged == true && startsWith(github.base_ref, 'epic/')
    runs-on: ubuntu-latest
    permissions:
      issues: write # sub-issue 닫기 + 로스터 코멘트
      pull-requests: read # 통합 PR 조회
      actions: write # 통합 PR core 런 재실행
      contents: read # 스크립트 체크아웃
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: 머지 후처리 (자동닫힘·로스터·재실행)
        # 값은 env로 넘긴다 — PR 본문을 run에 직접 펼치면 셸 주입 위험.
        env:
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/epic_merge_hook.py
